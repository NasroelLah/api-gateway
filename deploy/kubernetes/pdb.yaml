apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  # Ensure at least 2 pods are always available during disruptions
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
